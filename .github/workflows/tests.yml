name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # ubuntu ships bash 5 and zsh/dash are installable; macOS runners only have
    # bash 3.2, which ai-tools.sh deliberately refuses (see its header).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install zsh and dash
        run: sudo apt-get update -qq && sudo apt-get install -y zsh dash

      # CI runs the suites and nothing else. Inline steps used to duplicate
      # assertions that also lived in a suite, which meant a check could only be
      # run by pushing -- and twice today CI failed on an inline copy of
      # something already fixed in the suite beside it. Repo-wide invariants
      # (syntax of every tracked script, skill loadability) moved into
      # lib/tests/repo_test.sh so they run locally too.
      - name: repo invariants
        run: ./lib/tests/repo_test.sh

      - name: bootstrap suite
        run: ./lib/tests/bootstrap_test.sh

      - name: fs-helpers suite
        run: ./lib/tests/fs_helpers_test.sh

      - name: report-check suite
        run: ./lib/tests/report_check_test.sh

      - name: spec_builder suite
        run: ./lib/tests/spec_builder_test.sh

      - name: machine-setup suite
        run: ./lib/tests/machine_setup_test.sh
