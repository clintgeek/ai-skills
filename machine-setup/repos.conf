# machine-setup personal repos
# Add or edit entries here; the file is committed so it travels with new setups.

MACHINE_REPOS=(ai dotfiles)

# Repository fields:
#   REPO_NAME[id]       - Human-readable name
#   REPO_PATH[id]       - Where to clone it on the new machine
#   REPO_URL[id]        - Git URL (must be safe to commit, no secrets)
#   REPO_POST_CLONE[id] - Optional script, relative to REPO_PATH, to run after a fresh clone

typeset -A REPO_NAME REPO_PATH REPO_URL REPO_POST_CLONE

REPO_NAME[ai]="AI skills"
REPO_PATH[ai]="$HOME/.ai"
REPO_URL[ai]="git@github.com:clintgeek/ai-skills.git"
REPO_POST_CLONE[ai]=""

REPO_NAME[dotfiles]="Dotfiles"
REPO_PATH[dotfiles]="$HOME/dotfiles"
REPO_URL[dotfiles]="git@github.com:clintgeek/dotfiles.git"
REPO_POST_CLONE[dotfiles]="./install.sh"
